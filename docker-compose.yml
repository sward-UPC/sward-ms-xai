services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: sward
      POSTGRES_PASSWORD: sward
      POSTGRES_DB: xai_db
    ports:
      - "5437:5432"
  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
  app:
    build: .
    ports:
      - "8006:8006"
    environment:
      DATABASE_URL: postgresql+asyncpg://sward:sward@db:5432/xai_db
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    depends_on:
      - db
      - redis
